<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel ADM</title>

<style>
body{
  background:#0F0B1F;
  color:white;
  font-family:Arial;
  padding:20px;
}

textarea{
  width:100%;
  height:250px;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
}
</style>
</head>

<body>

<h2>Painel Administrativo</h2>

<textarea id="extrato"></textarea>

<button onclick="aprovarRecargas()">
Aprovar Recargas
</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const cliente = window.supabase.createClient(
  "https://earqyaxzdxbgpfqkatmz.supabase.co",
  "SUA_ANON_KEY_AQUI"
);

console.log("Supabase carregado");
console.log(cliente);
  
async function aprovarRecargas() {

  const { data, error } =
    await cliente
      .from("recargas")
      .select("*");

  console.log(data);

  if (error) {
    console.log(error);
    alert(error.message);
    return;
  }

  alert("Encontradas " + data.length + " recargas");
}

</script>

</body>
</html>
