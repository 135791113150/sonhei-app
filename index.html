<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B3DF5">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0F0B1F;
  color: white;
  text-align: center;
}

.container {
  padding: 20px;
}

.logo {
  width: 300px;
  margin-top: 30px;
}

h1 {
  margin: 10px 0;
}

input {
  width: 80%;
  padding: 12px;
  margin: 8px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button {
  width: 85%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #5B3DF5;
  color: white;
  font-size: 18px;
  font-weight: bold;
}
.botao-legenda {
  width: 42%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  background: #3E2AA8;
  color: white;
  font-size: 15px;
  font-weight: bold;
}
  .botao-pequeno {
  width: 38%;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: #2B1C66;
  color: white;
  font-size: 14px;
  font-weight: bold;
}
button:hover {
  background: #7a5cff;
}
</style>

</head>

<body>

<div class="container">

<img src="assets/icon.png" class="logo">

  
<div style="display:none;"><h1 style="font-size: 24px;">SONHEI</h1><p>Sua sorte, seu sonho</p></div>

  
<div style="display:flex; justify-content:center; gap:6px; margin-bottom:8px;">
  <button type="button" class="botao-pequeno">Saldo</button>
  <button type="button" class="botao-pequeno">Recarga</button>
</div>

<input 
  type="tel"
  placeholder="WhatsApp com DDD"
  id="telefone"
>

<div style="display:flex; justify-content:center; gap:6px; margin-top:10px; margin-bottom:8px;">
  <button type="button" class="botao-pequeno">Valor da aposta</button>
  <button type="button" class="botao-pequeno">Nível da aposta</button>
</div>

<input
  type="number"
  placeholder="Inserir: Dezena ou Centena ou Milhar"
  min="0"
  max="9999"
>
<div style="display:flex; justify-content:center; gap:6px; margin-top:15px;">

  <button 
    onclick="jogar()" 
    style="width:43%;">
    BRINCAR (JOGAR)
  </button>

  <button 
    onclick="limpar()" 
    style="width:28%;">
    LIMPAR
  </button>

  <button 
    class="botao-legenda"
    onclick="legenda()" 
    style="width:28%; margin-top:0;">
    Legenda
  </button>

</div>

</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script>
const SUPABASE_URL = "https://earqyaxzdxbgpfqkatmz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhcnF5YXh6ZHhiZ3BmcWthdG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjI1ODcsImV4cCI6MjA5NDA5ODU4N30.u0Q9qaHHfs-ptm6D7sJMBsI701ilIgKh3I9Y8_ucygo";

const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function jogar() {

const telefone = document.getElementById('telefone').value;

if (telefone.length > 11) {
  alert("WhatsApp com números excedidos, confira novamente");
  return;
}

if (telefone.length < 11) {
  alert("O WhatsApp deve conter 11 números com DDD");
  return;
}
  
  const inputs = document.querySelectorAll('input');

const unidade = 0;

if (!inputs[1].value) {
  alert("Inserir seu jogo no campo de aposta");
  return;
}

const numero = parseInt(inputs[1].value);

if (numero >= 0 && numero <= 9) {
  inputs[1].value = String(numero).padStart(2, '0');
}
if (!inputs[1].value) {
  alert("Informe o número da aposta");
  return;
}

if (numero < 0) {
  alert("Não é permitido número negativo");
  return;
}
  
if (numero > 9999) {
  alert("O número máximo permitido é 9999");
  return;
}
const dezena = numero <= 99 ? numero : 0;
const centena = numero >= 100 && numero <= 999 ? numero : 0;
const milhar = numero >= 1000 ? numero : 0;

const numeroJogado = String(numero).padStart(4, '0');

const agora = new Date();

const dataHora =
  agora.getFullYear().toString() +
  String(agora.getMonth() + 1).padStart(2, '0') +
  String(agora.getDate()).padStart(2, '0') +
  "_" +
  String(agora.getHours()).padStart(2, '0') +
  String(agora.getMinutes()).padStart(2, '0') +
  String(agora.getSeconds()).padStart(2, '0') +
  String(Math.floor(agora.getMilliseconds() / 10)).padStart(2, '0');

const quantidade = 1;

const { data: result, error } = await cliente
  .from('apostas')
  .insert([
    {
      unidade,
      dezena,
      centena,
      milhar,
      quantidade
    }
  ])
  .select();

if (result && result.length > 0) {

  const numeroRegistro = result[0].id;

 const dataFinal =
  `${numeroRegistro}_${dataHora}_${telefone}_${numeroJogado}`;

 await cliente
  .from('apostas')
  .update({
    data: dataFinal,
    telefone: telefone,
    aposta: numeroJogado
  })
    .eq('id', numeroRegistro);
}

if (error) {
  alert("Erro: " + error.message);
  console.log(error);
} else {
  alert("Aposta salva com sucesso!");
  limpar();
}

}

function limpar() {
  document.querySelectorAll('input').forEach(input => input.value = '');
}

function legenda() {
  alert("Só brinque se você for maior de 18 anos.");
}   
   
</script>
</body>
</html>
