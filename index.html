<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B3DF5">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0F0B1F;
  color: white;
  text-align: center;
}

.container {
  padding: 20px;
}

.logo {
  width: 120px;
  margin-top: 30px;
}

h1 {
  margin: 10px 0;
}

input {
  width: 80%;
  padding: 12px;
  margin: 8px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button {
  width: 85%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #5B3DF5;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

button:hover {
  background: #7a5cff;
}
</style>

</head>

<body>

<div class="container">

<img src="assets/icon.png" class="logo">

<h1>SONHEI</h1>

<p>Sua sorte, seu sonho</p>


<input type="number" placeholder="Dezena">
<input type="number" placeholder="Centena">
<input type="number" placeholder="Milhar">





<button onclick="jogar()">BRINCAR (JOGAR)</button>
<button onclick="limpar()">LIMPAR</button>

</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script>
const SUPABASE_URL = "https://earqyaxzdxbgpfqkatmz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhcnF5YXh6ZHhiZ3BmcWthdG16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MjI1ODcsImV4cCI6MjA5NDA5ODU4N30.u0Q9qaHHfs-ptm6D7sJMBsI701ilIgKh3I9Y8_ucygo";

const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function jogar() {

  const inputs = document.querySelectorAll('input');

const unidade = 0;

const dezena = inputs[0].value ? parseInt(inputs[0].value) : 0;
const centena = inputs[1].value ? parseInt(inputs[1].value) : 0;
const milhar = inputs[2].value ? parseInt(inputs[2].value) : 0;

const numeroJogado =
  milhar || centena || dezena || unidade;

const agora = new Date();

const dataHora =
  agora.getFullYear().toString() +
  String(agora.getMonth() + 1).padStart(2, '0') +
  String(agora.getDate()).padStart(2, '0') +
  "_" +
  String(agora.getHours()).padStart(2, '0') +
  String(agora.getMinutes()).padStart(2, '0') +
  String(agora.getSeconds()).padStart(2, '0') +
  String(Math.floor(agora.getMilliseconds() / 10)).padStart(2, '0');

const quantidade = 1;

const { data: result, error } = await cliente
  .from('apostas')
  .insert([
    {
      unidade,
      dezena,
      centena,
      milhar,
      quantidade
    }
  ])
  .select();

if (result && result.length > 0) {

  const numeroRegistro = result[0].id;

  const dataFinal =
    `${numeroRegistro}_${dataHora}_${numeroJogado}`;

  await cliente
    .from('apostas')
    .update({
      data: dataFinal
    })
    .eq('id', numeroRegistro);
}

function limpar() {
  document.querySelectorAll('input').forEach(input => input.value = '');
}
</script>
</body>
</html>
